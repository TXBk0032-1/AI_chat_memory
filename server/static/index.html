<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Memory</title>
    <link href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-100-M/KaTeX/0.16.0/katex.min.css">
    <script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-100-M/marked/4.3.0/marked.min.js"></script>
    <script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-100-M/KaTeX/0.16.0/katex.min.js"></script>
    <style>
        :root {
            --ink: #0a0a0f;
            --ink-deep: #060609;
            --scroll: #12121c;
            --scroll-hover: #1a1a2a;
            --cinnabar: #c73e3a;
            --cinnabar-glow: #e8524e;
            --jade: #2dd4a8;
            --jade-dim: #1a8a6e;
            --gold: #d4a72d;
            --gold-dim: #8a6e1a;
            --mist: #b8b8cc;
            --mist-dim: #5a5a72;
            --void: rgba(0,0,0,0.85);
            --font-seal: 'Noto Serif SC', serif;
            --font-body: 'Noto Sans SC', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--ink);
            color: var(--mist);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === 背景纹理 === */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(199,62,58,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 90%, rgba(45,212,168,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0v60M0 30h60' stroke='%23ffffff' stroke-width='0.3' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* === 布局 === */
        .app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

        /* === 顶栏 === */
        header {
            padding: 28px 40px 20px;
            border-bottom: 1px solid rgba(199,62,58,0.15);
            background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.8) 100%);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 14px;
        }

        .logo-glyph {
            font-family: var(--font-seal);
            font-size: 28px;
            font-weight: 900;
            color: var(--cinnabar);
            text-shadow: 0 0 30px rgba(199,62,58,0.4);
            letter-spacing: 2px;
        }

        .logo-sub {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--mist-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .stats {
            display: flex;
            gap: 24px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--mist-dim);
        }

        .stat-val {
            color: var(--jade);
            font-weight: 600;
        }

        /* === 工具栏 === */
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-box::before {
            content: '⌕';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--mist-dim);
            font-size: 16px;
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--scroll);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px;
            color: var(--mist);
            font-family: var(--font-body);
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }

        .search-box input:focus {
            border-color: rgba(199,62,58,0.4);
            box-shadow: 0 0 0 3px rgba(199,62,58,0.08);
        }

        .search-box input::placeholder { color: var(--mist-dim); }

        .date-range {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .date-range input[type="date"] {
            padding: 8px 10px;
            background: var(--scroll);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px;
            color: var(--mist);
            font-family: var(--font-mono);
            font-size: 12px;
            outline: none;
            transition: all 0.3s;
        }

        .date-range input[type="date"]:focus {
            border-color: rgba(199,62,58,0.4);
        }

        .date-range input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
            cursor: pointer;
        }

        .date-range-sep {
            color: var(--mist-dim);
            font-size: 12px;
        }

        .filter-pills {
            display: flex;
            gap: 6px;
        }

        .pill {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.06);
            background: var(--scroll);
            color: var(--mist-dim);
            font-family: var(--font-body);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s;
            user-select: none;
        }

        .pill:hover { border-color: rgba(255,255,255,0.12); color: var(--mist); }
        .pill.active { border-color: var(--cinnabar); color: var(--cinnabar-glow); background: rgba(199,62,58,0.08); }

        .btn-refresh {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid rgba(45,212,168,0.2);
            background: rgba(45,212,168,0.06);
            color: var(--jade);
            font-family: var(--font-mono);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 1px;
        }

        .btn-refresh:hover { background: rgba(45,212,168,0.12); border-color: rgba(45,212,168,0.4); }

        /* === 主内容 === */
        main { flex: 1; padding: 24px 40px 60px; }

        /* === 会话列表 === */
        .sessions { display: flex; flex-direction: column; gap: 2px; }

        .session-card {
            display: grid;
            grid-template-columns: 6px 1fr auto;
            gap: 0;
            background: var(--scroll);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
            opacity: 0;
            transform: translateY(8px);
            animation: fadeSlideIn 0.3s ease forwards;
        }

        @keyframes fadeSlideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .session-card:hover {
            background: var(--scroll-hover);
            border-color: rgba(199,62,58,0.15);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .session-accent {
            background: var(--cinnabar);
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .session-card:hover .session-accent { opacity: 1; }

        .session-accent.deepseek { background: #4a6cf4; }
        .session-accent.doubao { background: var(--cinnabar); }
        .session-accent.chatgpt { background: #10a37f; }
        .session-accent.claude { background: var(--gold); }
        .session-accent.kimi { background: #7c5cfc; }

        .session-body {
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .session-title {
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            color: #e0e0ee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .session-meta {
            display: flex;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--mist-dim);
        }

        .session-side {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .platform-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .platform-tag.deepseek { color: #7b9aff; background: rgba(74,108,244,0.12); }
        .platform-tag.doubao { color: var(--cinnabar-glow); background: rgba(199,62,58,0.12); }
        .platform-tag.chatgpt { color: #4ade80; background: rgba(16,163,127,0.12); }
        .platform-tag.claude { color: var(--gold); background: rgba(212,167,45,0.12); }
        .platform-tag.kimi { color: #a78bfa; background: rgba(124,92,252,0.12); }

        .btn-delete {
            opacity: 0;
            padding: 4px 8px;
            border: none;
            background: rgba(199,62,58,0.1);
            color: var(--cinnabar);
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .session-card:hover .btn-delete { opacity: 0.6; }
        .btn-delete:hover { opacity: 1 !important; background: rgba(199,62,58,0.25); }

        /* === 空状态 === */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
        }

        .empty-glyph {
            font-family: var(--font-seal);
            font-size: 64px;
            color: rgba(199,62,58,0.15);
            margin-bottom: 20px;
        }

        .empty-text {
            font-size: 15px;
            color: var(--mist-dim);
            line-height: 1.8;
        }

        .empty-text code {
            font-family: var(--font-mono);
            font-size: 12px;
            background: var(--scroll);
            padding: 2px 8px;
            border-radius: 3px;
            color: var(--jade);
        }

        /* === 模态框 === */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--void);
            z-index: 100;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active { display: flex; justify-content: center; }
        .modal-overlay.visible { opacity: 1; }

        .modal-panel {
            width: 100%;
            max-width: 800px;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--ink-deep);
            border-left: 1px solid rgba(199,62,58,0.1);
            border-right: 1px solid rgba(199,62,58,0.1);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.visible .modal-panel { transform: translateY(0); }

        .modal-header {
            padding: 24px 32px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-shrink: 0;
        }

        .modal-title-group { min-width: 0; flex: 1; }

        .modal-title {
            font-family: var(--font-seal);
            font-size: 20px;
            font-weight: 700;
            color: #e8e8f0;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .modal-meta {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--mist-dim);
            display: flex;
            gap: 16px;
        }

        .btn-close {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            background: transparent;
            color: var(--mist-dim);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-close:hover { border-color: var(--cinnabar); color: var(--cinnabar); }

        /* === 消息列表 === */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 32px 40px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: rgba(199,62,58,0.2); border-radius: 2px; }

        .msg {
            margin-bottom: 24px;
            opacity: 0;
            animation: msgIn 0.25s ease forwards;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .msg-role {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .msg-role.user { color: var(--jade); }
        .msg-role.assistant { color: var(--cinnabar-glow); }
        .msg-role.system { color: var(--gold); }
        .msg-role.tool { color: #a78bfa; }

        .msg-time {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--mist-dim);
        }

        .msg-divider {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.04);
        }

        .msg-content {
            font-size: 14px;
            line-height: 1.75;
            color: #d0d0de;
            word-break: break-word;
            padding-left: 2px;
        }

        .msg-content p { margin: 0.5em 0; }
        .msg-content h1, .msg-content h2, .msg-content h3, .msg-content h4 { color: #e8e8f0; margin: 1em 0 0.5em; font-family: var(--font-seal); }
        .msg-content h1 { font-size: 1.4em; }
        .msg-content h2 { font-size: 1.2em; }
        .msg-content h3 { font-size: 1.05em; }
        .msg-content ul, .msg-content ol { padding-left: 1.5em; margin: 0.5em 0; }
        .msg-content li { margin: 0.25em 0; }
        .msg-content code { font-family: var(--font-mono); font-size: 0.9em; background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; color: var(--jade); }
        .msg-content pre { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; padding: 14px 18px; overflow-x: auto; margin: 0.8em 0; }
        .msg-content pre code { background: none; padding: 0; color: #c8c8dc; }
        .msg-content blockquote { border-left: 3px solid var(--cinnabar); padding: 4px 16px; margin: 0.5em 0; color: var(--mist-dim); background: rgba(199,62,58,0.04); }
        .msg-content table { border-collapse: collapse; margin: 0.8em 0; width: 100%; }
        .msg-content th, .msg-content td { border: 1px solid rgba(255,255,255,0.08); padding: 6px 12px; text-align: left; }
        .msg-content th { background: rgba(255,255,255,0.04); color: #e8e8f0; }
        .msg-content a { color: var(--jade); text-decoration: none; }
        .msg-content a:hover { text-decoration: underline; }
        .msg-content strong { color: #e8e8f0; }
        .msg-content hr { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 1em 0; }
        .katex-block { overflow-x: auto; padding: 8px 0; text-align: center; }
        .katex-block .katex { font-size: 1.1em; }

        /* === 思考折叠 === */
        .thinking-block { margin-bottom: 12px; }
        .thinking-toggle {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 4px; cursor: pointer; user-select: none;
            background: rgba(212,167,45,0.08); border: 1px solid rgba(212,167,45,0.15);
            color: var(--gold); font-family: var(--font-mono); font-size: 11px;
            transition: all 0.2s;
        }
        .thinking-toggle:hover { background: rgba(212,167,45,0.15); }
        .thinking-toggle::before { content: '▶'; font-size: 8px; transition: transform 0.2s; }
        .thinking-block.open .thinking-toggle::before { transform: rotate(90deg); }
        .thinking-content {
            display: none; margin-top: 8px; padding: 12px 16px;
            background: rgba(212,167,45,0.04); border-left: 2px solid rgba(212,167,45,0.2);
            border-radius: 0 4px 4px 0; color: var(--mist-dim); font-size: 13px; line-height: 1.7;
        }
        .thinking-block.open .thinking-content { display: block; }

        .msg.user .msg-content {
            background: rgba(45,212,168,0.04);
            border-left: 2px solid rgba(45,212,168,0.2);
            padding: 12px 16px;
            border-radius: 0 4px 4px 0;
        }

        /* === 加载动画 === */
        .loading {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .loading-dots { display: flex; gap: 6px; }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: var(--cinnabar);
            border-radius: 50%;
            animation: pulse 1.2s ease infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        /* === 响应式 === */
        @media (max-width: 768px) {
            header, main { padding-left: 16px; padding-right: 16px; }
            .header-top { flex-direction: column; gap: 12px; }
            .toolbar { flex-wrap: wrap; }
            .search-box { max-width: 100%; }
            .modal-header, .messages { padding-left: 16px; padding-right: 16px; }
            .session-card { grid-template-columns: 4px 1fr; }
            .session-side { display: none; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="header-top">
                <div class="logo">
                    <span class="logo-glyph">藏经阁</span>
                    <span class="logo-sub">AI Chat Memory</span>
                </div>
                <div class="stats">
                    <span><span class="stat-val" id="stat-total">0</span> 卷</span>
                    <span><span class="stat-val" id="stat-platforms">0</span> 源</span>
                </div>
            </div>
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="search" placeholder="搜索标题或对话内容...">
                </div>
                <div class="date-range">
                    <input type="date" id="date-from" title="起始日期">
                    <span class="date-range-sep">—</span>
                    <input type="date" id="date-to" title="截止日期">
                </div>
                <div class="filter-pills" id="filters">
                    <div class="pill active" data-platform="">全部</div>
                    <div class="pill" data-platform="deepseek">DeepSeek</div>
                    <div class="pill" data-platform="doubao">豆包</div>
                    <div class="pill" data-platform="chatgpt">ChatGPT</div>
                    <div class="pill" data-platform="kimi">Kimi</div>
                </div>
                <button class="btn-refresh" onclick="doSearch()">搜索</button>
            </div>
        </header>

        <main>
            <div id="sessions" class="sessions"></div>
        </main>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-panel">
            <div class="modal-header">
                <div class="modal-title-group">
                    <div class="modal-title" id="modal-title"></div>
                    <div class="modal-meta" id="modal-meta"></div>
                </div>
                <button class="btn-close" onclick="closeModal()">×</button>
            </div>
            <div class="messages" id="modal-messages"></div>
        </div>
    </div>

    <script>
        const API = '/api/v1';
        let allSessions = [];
        let currentPlatform = '';
        const sessionCache = {};
        let searchTimer = null;

        // === 筛选器 ===
        document.getElementById('filters').addEventListener('click', e => {
            const pill = e.target.closest('.pill');
            if (!pill) return;
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            currentPlatform = pill.dataset.platform;
            doSearch();
        });

        // === 搜索（走后端） ===
        async function doSearch() {
            const container = document.getElementById('sessions');
            container.innerHTML = '<div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div></div>';

            const q = document.getElementById('search').value.trim();
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;

            const params = new URLSearchParams();
            if (q) params.set('q', q);
            if (currentPlatform) params.set('platform', currentPlatform);
            if (dateFrom) params.set('date_from', String(new Date(dateFrom).getTime() / 1000));
            if (dateTo) params.set('date_to', String(new Date(dateTo + 'T23:59:59').getTime() / 1000));
            params.set('limit', '500');

            const res = await fetch(`${API}/sessions/search?${params}`);
            const data = await res.json();
            allSessions = data.sessions || [];
            updateStats();
            renderSessions();
        }

        // === 加载会话（初始） ===
        async function loadSessions() {
            const container = document.getElementById('sessions');
            container.innerHTML = '<div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div></div>';

            const res = await fetch(`${API}/sessions?limit=500`);
            const data = await res.json();
            allSessions = data.sessions || [];
            updateStats();
            renderSessions();
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = allSessions.length;
            const platforms = new Set(allSessions.map(s => s.platform));
            document.getElementById('stat-platforms').textContent = platforms.size;
        }

        function renderSessions() {
            const container = document.getElementById('sessions');

            if (allSessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-glyph">虚</div>
                        <div class="empty-text">
                            藏经阁空空如也<br>
                            请通过油猴脚本 <code>🔄 同步到本地服务</code> 导入对话
                        </div>
                    </div>`;
                return;
            }

            container.innerHTML = allSessions.map((s, i) => `
                <div class="session-card" style="animation-delay:${Math.min(i * 20, 500)}ms" onclick="openSession('${s.id}')">
                    <div class="session-accent ${s.platform}"></div>
                    <div class="session-body">
                        <div class="session-title">${escapeHtml(s.title || '无标题')}</div>
                        <div class="session-meta">
                            <span>${formatTime(s.updated_at)}</span>
                        </div>
                    </div>
                    <div class="session-side">
                        <span class="platform-tag ${s.platform}">${s.platform}</span>
                        <button class="btn-delete" onclick="event.stopPropagation();deleteSession('${s.id}')">✕</button>
                    </div>
                </div>
            `).join('');
        }

        // === 会话详情 ===
        async function openSession(id) {
            const modal = document.getElementById('modal');
            const msgContainer = document.getElementById('modal-messages');
            modal.classList.add('active');
            requestAnimationFrame(() => modal.classList.add('visible'));

            if (sessionCache[id]) {
                renderModal(sessionCache[id]);
                return;
            }

            msgContainer.innerHTML = '<div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
            const res = await fetch(`${API}/sessions/${id}`);
            const session = await res.json();
            sessionCache[id] = session;
            renderModal(session);
        }

        function renderModal(session) {
            const msgContainer = document.getElementById('modal-messages');
            document.getElementById('modal-title').textContent = session.title || '无标题';
            document.getElementById('modal-meta').innerHTML = `
                <span>${session.platform}</span>
                <span>${formatTime(session.updated_at)}</span>
                <span>${(session.messages || []).length} 条消息</span>
            `;

            const messages = session.messages || [];
            if (messages.length === 0) {
                msgContainer.innerHTML = '<div class="empty-state"><div class="empty-glyph">空</div><div class="empty-text">此卷无内容</div></div>';
                return;
            }

            msgContainer.innerHTML = messages.map((m, i) => {
                const role = (m.role || '').toLowerCase();
                const thinking = m.metadata?.thinking;
                const thinkHtml = thinking ? `
                    <div class="thinking-block" onclick="this.classList.toggle('open')">
                        <div class="thinking-toggle">思考过程</div>
                        <div class="thinking-content">${renderContent(thinking)}</div>
                    </div>` : '';
                return `
                <div class="msg ${role}" style="animation-delay:${i * 30}ms">
                    <div class="msg-header">
                        <span class="msg-role ${role}">${role}</span>
                        ${m.created_at ? `<span class="msg-time">${formatTime(m.created_at)}</span>` : ''}
                        <div class="msg-divider"></div>
                    </div>
                    ${thinkHtml}
                    <div class="msg-content">${renderContent(m.content || '')}</div>
                </div>`;
            }).join('');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('visible');
            setTimeout(() => modal.classList.remove('active'), 300);
        }

        // === 删除 ===
        async function deleteSession(id) {
            if (!confirm('确认删除此卷？')) return;
            await fetch(`${API}/sessions/${id}`, { method: 'DELETE' });
            loadSessions();
        }

        // === 工具 ===
        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderContent(text) {
            if (!text) return '';
            // 先提取代码块保护，避免转义代码块内容
            const codeBlocks = [];
            text = text.replace(/```([\s\S]*?)```/g, (m, code) => {
                codeBlocks.push(m);
                return `%%CODEBLOCK_${codeBlocks.length - 1}%%`;
            });
            // 转义 HTML 防止注入
            text = escapeHtml(text);
            // 还原代码块（代码块内也转义，marked 会处理）
            text = text.replace(/%%CODEBLOCK_(\d+)%%/g, (_, i) => escapeHtml(codeBlocks[i]));
            // LaTeX: $$...$$ → block, $...$ → inline
            text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
                try { return '<div class="katex-block">' + katex.renderToString(tex.trim(), {displayMode:true,throwOnError:false}) + '</div>'; }
                catch { return '$$' + tex + '$$'; }
            });
            text = text.replace(/\$([^\n$]+?)\$/g, (_, tex) => {
                try { return katex.renderToString(tex.trim(), {displayMode:false,throwOnError:false}); }
                catch { return '$' + tex + '$'; }
            });
            // LaTeX: \[...\] → block, \(...\) → inline
            text = text.replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => {
                try { return '<div class="katex-block">' + katex.renderToString(tex.trim(), {displayMode:true,throwOnError:false}) + '</div>'; }
                catch { return '\\[' + tex + '\\]'; }
            });
            text = text.replace(/\\\(([\s\S]+?)\\\)/g, (_, tex) => {
                try { return katex.renderToString(tex.trim(), {displayMode:false,throwOnError:false}); }
                catch { return '\\(' + tex + '\\)'; }
            });
            return typeof marked !== 'undefined' ? marked.parse(text) : text;
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = typeof ts === 'number' ? new Date(ts * 1000) : new Date(ts);
            if (isNaN(d)) return '';
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff/60000)}分钟前`;
            if (diff < 86400000) return `${Math.floor(diff/3600000)}小时前`;
            if (diff < 604800000) return `${Math.floor(diff/86400000)}天前`;
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        // === 事件 ===
        document.getElementById('search').addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(doSearch, 400);
        });
        document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(); } });
        document.getElementById('date-from').addEventListener('change', doSearch);
        document.getElementById('date-to').addEventListener('change', doSearch);
        document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        loadSessions();
    </script>
</body>
</html>
