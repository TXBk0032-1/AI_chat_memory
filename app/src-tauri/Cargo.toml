[package]
name = "ai-chat-memory-desktop"
version = "0.1.0"
description = "Local-first cross-platform AI conversation archive"
authors = ["AI Chat Memory contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_chat_memory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "fs", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
sqlite-vec = "=0.1.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = "4"
rand = "0.9"
http = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
zstd = "0.13"
argon2 = "0.5"
chacha20poly1305 = "0.10"
keyring = "3"
zeroize = { version = "1", features = ["derive"] }
quick-xml = { version = "0.38", features = ["serialize"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
    async-trait = "0.1"
    rmcp = { version = "2.2", default-features = false, features = [
      "server",
      "transport-streamable-http-server",
      "macros",
    ] }
    candle-core = { version = "0.9.1", features = ["cuda"] }
candle-nn = { version = "0.9.1", features = ["cuda"] }
candle-transformers = { version = "0.9.1" }
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[patch.crates-io]
# GTK3 pins Tauri's Linux stack to glib 0.18. Keep the compatible release and
# backport the fix for RUSTSEC-2024-0429 until the upstream stack can use 0.20.
glib = { path = "vendor/glib" }
