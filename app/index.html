<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>对话归档</title>
    <style>
      html, body, #app {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: transparent;
      }
      body {
        min-width: 760px;
        min-height: 100vh;
        overflow: hidden;
        font-family: Inter, "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #202327;
      }
      .boot-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        grid-template-rows: 36px minmax(0, 1fr);
        border-radius: 16px;
        overflow: hidden;
      }
      .boot-titlebar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        color: #4b555a;
        font-size: 11px;
        font-weight: 650;
        background: linear-gradient(135deg, #f7f9fadb, #e6eceec7);
        border-bottom: 1px solid #ffffffa6;
        -webkit-backdrop-filter: blur(24px) saturate(1.45);
        backdrop-filter: blur(24px) saturate(1.45);
      }
      .boot-titlebar-mark {
        width: 9px;
        height: 9px;
        border-radius: 3px;
        background: #39ad8d;
      }
      .boot-sidebar {
        background: #eef1f2b8;
        border-right: 1px solid #d5dbddcc;
        padding: 20px 14px;
      }
      .boot-workspace {
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      .boot-header {
        min-height: 86px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 26px;
        border-bottom: 1px solid #dfe3e5;
      }
      .boot-header strong {
        font-size: 20px;
        font-weight: 680;
      }
      .boot-header span {
        margin-top: 5px;
        color: #7a8287;
        font-size: 12px;
      }
      .boot-body {
        flex: 1;
        display: grid;
        place-items: center;
        color: #687176;
        font-size: 13px;
        background: linear-gradient(180deg, #fbfcfc, #f4f6f7);
      }
      .boot-pulse {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .boot-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #39ad8d;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% { opacity: .35; transform: scale(.85); }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="boot-shell" aria-busy="true">
        <div class="boot-titlebar"><span class="boot-titlebar-mark"></span><span data-i18n="app.title">对话归档</span></div>
        <aside class="boot-sidebar"></aside>
        <main class="boot-workspace">
          <div class="boot-header"><strong data-i18n="boot.heading">全部对话</strong><span data-i18n="boot.subtitle">正在准备本地界面</span></div>
          <div class="boot-body"><div class="boot-pulse"><span class="boot-dot"></span><span data-i18n="boot.status">正在启动…</span></div></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
