name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # windows-latest 已迁移到 VS 2026（MSVC 14.5x），CUDA 13.3 的 nvcc 不支持；
    # 锁定 windows-2022（VS2022 / MSVC 14.4x）与本机工具链一致。
    # windows-2022 退役时需升级 CUDA 或改用 VCToolsVersion 指定 14.44 工具集。
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.3.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "curand", "nvrtc", "visual_studio_integration"]'

      - name: Build and test release
        env:
          CUDA_COMPUTE_CAP: "89"
        shell: pwsh
        run: ./scripts/ci.ps1 release

      - name: Verify portable ZIP
        shell: pwsh
        run: |
          $plan = ./scripts/build-windows-installers.ps1 -PlanOnly | ConvertFrom-Json
          ./scripts/verify-portable-archive.ps1 `
            -ArchivePath (Join-Path "artifacts" $plan.portable.name) `
            -ExpectedEntryName $plan.portable.entry_name

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-memory-windows-release
          path: artifacts/*
          if-no-files-found: error
